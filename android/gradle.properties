org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# AGP 9 内建 Kotlin（Built-in Kotlin）。
# Flutter 模板默认写 false（兼容旧的 org.jetbrains.kotlin.android / KGP），
# 本工程已完成迁移，显式置为 true：
#   1) 阻止 flutter 的 DisableBuiltInKotlinMigration 自动补回 android.builtInKotlin=false
#      （该 migrator 只在属性缺失时才写入）；
#   2) 让 AGP 自己编译 Kotlin，app 与各 Flutter 插件都不再需要 apply KGP。
# 注意：属性名大小写敏感，必须写成 android.builtInKotlin。
android.builtInKotlin=true

# Kotlin 增量编译关闭。
# 本机 pub 缓存在 C: 盘、工程在 D: 盘，Kotlin 的"可重定位增量缓存"
# （RelocatableFileToPathConverter）会把源文件路径相对于工程目录取相对路径，
# 跨盘时抛 IllegalArgumentException: this and base files have different roots，
# 直接导致插件模块 compileDebugKotlin 失败。
kotlin.incremental=false

# AGP 9 新版 DSL 暂时保持关闭。
# 这一步不是"没迁移"，而是 Flutter 3.47 官方仍然默认 false：
# 大量 Flutter 插件的 android/build.gradle 还在用旧 DSL 类型，
# Flutter 侧的新 DSL 迁移尚未完成（flutter/flutter#180137、#184838）。
# 等上游把插件都迁移完、并且 Flutter 移除旧 DSL 支持后再打开。
android.newDsl=false
