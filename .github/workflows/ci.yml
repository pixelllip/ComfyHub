# 回归门：格式、静态检查、用例。
#
# 两条必过检查（与 AGENTS §1 / README §10 的验收口径一致）：
#   · 前端：dart format --set-exit-if-changed + flutter analyze + flutter test
#   · 后端：cargo fmt --check + cargo clippy --all-targets -D warnings + cargo test
#
# 刻意**没有**放进来：
#   · `scripts\e2e-*.ps1`：依赖本机后端与 ComfyUI 现场，不进 CI。
#
# 格式门禁的前提是「仓库本身是格式化过的」—— 2026-11-06 用一次只格式化、
# 不改逻辑的提交把两端都跑了一遍；之后谁提交了没格式化的代码，这里当场红。
#
# `cargo clippy` 覆盖 `--all-targets`（生产代码 + 测试代码都已零告警）。
#
# 升 Flutter 版本时改 `flutter-version`（与开发机 `flutter --version` 对齐），
# 然后在本机先跑一遍 format / analyze / test —— 这几步过了，这里就不会红。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连推多次时只跑最后一次，省 Windows runner 的分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter (format + analyze + test)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: 装 Flutter（与开发机同版本）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: 取依赖
        run: flutter pub get

      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态检查
        run: flutter analyze

      - name: 用例
        run: flutter test

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server-rs
    steps:
      - uses: actions/checkout@v4

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          # 工作区在 server-rs/，target 也在它下面
          workspaces: server-rs -> target

      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy（生产代码 + 测试代码零告警）
        run: cargo clippy --all-targets -- -D warnings

      # rusqlite 的 bundled 要 C 编译器：windows-latest 自带 MSVC，不用额外装
      - name: 用例
        run: cargo test
