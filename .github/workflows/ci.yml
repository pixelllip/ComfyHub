# 最小回归门：只守「功能有没有坏」。
#
# 两条必过检查（与 AGENTS §1 / README §10 的验收口径一致）：
#   · 前端：flutter analyze + flutter test
#   · 后端：cargo test
#
# 刻意**没有**放进来：
#   · `dart format` / `cargo fmt`：仓库当前并不干净（一次格式化会动上百个文件），
#     先清干净再开成必过项，否则第一天就是红的；
#   · `scripts\e2e-*.ps1`：依赖本机后端与 ComfyUI 现场，不进 CI。
#
# `cargo clippy` 只覆盖 `--lib --bins`（生产代码已经零告警）；测试代码里还有一批
# 风格告警，清完之后再把 `--all-targets` 加进来。
#
# 升 Flutter 版本时改 `flutter-version`（与开发机 `flutter --version` 对齐），
# 然后在本机先跑一遍 analyze / test —— 这两步过了，这里就不会红。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连推多次时只跑最后一次，省 Windows runner 的分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter (analyze + test)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: 装 Flutter（与开发机同版本）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: 取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 用例
        run: flutter test

  rust:
    name: Rust (cargo test)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server-rs
    steps:
      - uses: actions/checkout@v4

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          # 工作区在 server-rs/，target 也在它下面
          workspaces: server-rs -> target

      # 生产代码（lib + bin）零告警。**先不覆盖 `--all-targets`**：测试代码里还有一批
      # 风格告警，等清完再把范围放大，否则这条第一天就是红的。
      - name: Clippy
        run: cargo clippy --lib --bins -- -D warnings

      # rusqlite 的 bundled 要 C 编译器：windows-latest 自带 MSVC，不用额外装
      - name: 用例
        run: cargo test
