[package]
name = "comfyhub-server-rs"
version = "0.1.0"
edition = "2021"
# 发布包里这个二进制就叫 comfyhub-server（脚本/comfyhub.ps1 按名字找它）
description = "ComfyHub 桌面服务端（Rust 版，P4 灰度中）"

[[bin]]
name = "comfyhub-server-rs"
path = "src/main.rs"

[dependencies]
# 与 docs/implementation-master-plan.md §5.1 的选型一致（版本按当时最新 stable）
axum = { version = "0.8", features = ["multipart"] }
# `process` / `sync` / `time` 是 MCP 桥（P4 第 45 步）要的：把 comfy-mcp 当子进程驱动，
# 用 oneshot 把 JSON-RPC 回包送到等在 `request()` 里的那一侧，并按工具给不同超时。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "process", "sync", "time"] }
# ★ bundled：SQLite 编进二进制 → 发布包不再需要 MySQL / JRE / VC++ 运行时
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# 上传去重键：按文件内容的 SHA-256（与 Kotlin `MediaFiles.sha256` 同一个口径）
sha2 = "0.10"
# ★ `preserve_order` 是**为了与 Kotlin 对齐**而开的（P4 第 43 步）：Kotlin 的 `JsonObject`
#   是插入序（= JSON 文本里的键顺序），而 serde_json 默认的 `Map` 是 **BTreeMap（按键排序）**。
#   `GraphParse` 的启发式全是"文档顺序里第一个命中的节点"（找采样器 / 找 steps / 找 seed…），
#   顺序一变、多候选的图上解析出来的 seed 与提示词就与 Kotlin 不同，**而且不报错**。
#   开这一项之后 Rust 的 Map 顺序与 Kotlin 一致（`indexmap`）。
#   注意：`sync.rs` 的行 → JSON 也顺带变成"列顺序"（更贴近 Kotlin），
#   而 `run_kit.rs` 的 `kitVersion` 签名本来就是手工拼字符串，不受影响。
serde_json = { version = "1", features = ["preserve_order"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
# 文件流：`ReaderStream` 把 `tokio::fs::File` 变成 `Body::from_stream` 能吃的东西
tokio-util = { version = "0.7", features = ["io"] }
# 缩略图：替掉 Kotlin 的 ImageIO + TwelveMonkeys(WebP)。
# 只开真正要用的解码器 —— 每多一个 feature 就多一份编译时间与潜在 CVE 面；
# avif 刻意不开：没有解码器时按"回退原图"处理（与 Kotlin 的行为一致）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
# SSE 事件流：`Body::from_stream` 要一个 `Stream`，手写 `poll_next` 不如直接用现成的 trait。
# 只开 `std`（`Stream` / `StreamExt` 都在里面）—— 不引整个 futures 生态。
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# 出网 HTTP 客户端（上游 LLM 调用，P4 第 29 步）。
# ★ **只开 rustls-tls**：不用 OpenSSL —— 发布包要便携，不能要求用户装一个
#   系统 TLS 库，而 ring/rustls 是编进二进制的。
# `stream` 给 SSE 的逐块读用；`http2` 关掉（Anthropic/OpenAI 用 1.1 就够，
#   少一个协议实现少一份 CVE 面）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# 日志里的端点要**只留 scheme://host:port/path**（不带 query / 凭据，规则 1）。
# 手写字符串切分比拉一个 URL 解析器更容易出错，而它本来就是 reqwest 的依赖。
url = "2"
# PNG 文本块（zTXt / 压缩的 iTXt）要 zlib 解压。用 miniz_oxide（**纯 Rust**）。
# 不引 flate2 的 C 后端：发布包要便携，不能为一个 PNG 元数据块带进构建需求。
miniz_oxide = "0.8"
# ComfyUI 的**实时进度**只从 WebSocket 来（REST 的 /queue、/progress、/history 都没有进度，
# 2026-09-27 本机实测）：`comfy_progress.rs` 常驻连 `<comfyUrl>/ws`。
# ★ **default-features = false + 只开 connect/handshake**：这两个 feature 给的是明文
#   `ws://` 的 `connect_async`，**不带任何 TLS 后端** —— 一开 native-tls 就会把
#   OpenSSL/native-tls 拖进发布包（AGENTS §11 第 4 条：便携性优先），
#   而 ComfyUI 就在本机/内网，永远不需要 wss。
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
# `GET /api/net/urls` 要**枚举本机网卡**（回环 / 局域网 / Tailscale 三条路的候选地址）。
# std 没有这个能力，而这个小 crate 纯 Rust、不拖任何 TLS/系统库 ——
# 与上面那条同一个判据：发布包要便携。
if-addrs = "0.13"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# 集成测试要自己造一张真图（缩略图那条链路的输入必须真能解码）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 夹具要写**带 tEXt 文本块的真 PNG**（ComfyUI 就是把 prompt 写在那儿）——png 会自动算 CRC
png = "0.17"
