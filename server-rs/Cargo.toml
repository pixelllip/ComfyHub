[package]
name = "comfyhub-server-rs"
version = "0.1.0"
edition = "2021"
# 发布包里这个二进制就叫 comfyhub-server（脚本/comfyhub.ps1 按名字找它）
description = "ComfyHub 桌面服务端（Rust 版，P4 灰度中）"

[[bin]]
name = "comfyhub-server-rs"
path = "src/main.rs"

[dependencies]
# 与 docs/implementation-master-plan.md §5.1 的选型一致（版本按当时最新 stable）
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# ★ bundled：SQLite 编进二进制 → 发布包不再需要 MySQL / JRE / VC++ 运行时
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7", features = ["cors", "trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
