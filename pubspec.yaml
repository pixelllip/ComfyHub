name: viewer
description: "ComfyHub — ComfyUI 提示词与生成产物管理"
publish_to: 'none'

version: 0.3.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # 中文本地化：文本框的选择菜单（复制 / 全选）、返回按钮 tooltip 等
  # 都走 MaterialLocalizations，不接这一层就会漏出英文的 "Copy / Select all"
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- 网络 / 状态 / 本地设置 ---
  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  # shared_preferences_windows 的 pathProvider 字段类型就是它；
  # portable_paths.dart 要 subclass 它把偏好落盘位置搬进项目内（受限会话加固）。
  path_provider_windows: ^2.3.0
  # SharedPreferencesStorePlatform 在这里（shared_preferences 只 export types.dart）。
  shared_preferences_platform_interface: ^2.4.2
  # 直接 import 它拿 SharedPreferencesWindows（换掉 pathProvider 注入缝）。
  shared_preferences_windows: ^2.4.1

  # --- 选择本地文件上传 ---
  file_picker: ^12.3.0

  # --- 时间格式化 ---
  intl: ^0.20.3

  # --- 媒体播放 ---
  # Windows 走 Media Foundation（不需要联网拉二进制），用 third_party 里的本地副本：
  # 上游 3.2.2 的 GpuSurfaceDescriptor 少了 visible_width / visible_height，而
  # Impeller（Windows 上默认的渲染后端）正是拿这两个字段当外部纹理尺寸 ——
  # 结果是「只有声音、画面全黑」。
  # 补丁内容见 third_party/video_player_win/windows/video_player_win_plugin.cpp
  # ⚠ 别把它"顺手升级"回 pub.dev：一升回去就立刻复发（AGENTS §9）。
  video_player_win:
    path: third_party/video_player_win
  # 安卓 / iOS 走**官方** video_player（`video_player_win` 只有 Windows 实现，
  # 手机上的表现曾经是"当前平台不支持内嵌播放"）。两份实现由
  # lib/widgets/video_view.dart 的 PlatformVideoView 按平台分派 ——
  # 它们不是二选一：**两个都要留着**。
  video_player: ^2.14.0
  audioplayers: ^6.8.1

  # --- 用系统默认播放器打开（兜底） ---
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
