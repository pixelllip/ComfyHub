name: viewer
description: "ComfyHub — ComfyUI 提示词与生成产物管理"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # 中文本地化：文本框的选择菜单（复制 / 全选）、返回按钮 tooltip 等
  # 都走 MaterialLocalizations，不接这一层就会漏出英文的 "Copy / Select all"
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- 网络 / 状态 / 本地设置 ---
  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5

  # --- 选择本地文件上传 ---
  file_picker: ^12.3.0

  # --- 时间格式化 ---
  intl: ^0.20.3

  # --- 媒体播放（Windows 走 Media Foundation，不需要联网拉二进制） ---
  # 用 third_party 里的本地副本：上游 3.2.2 的 GpuSurfaceDescriptor 少了
  # visible_width / visible_height，而 Impeller（Windows 上默认的渲染后端）正是
  # 拿这两个字段当外部纹理尺寸 —— 结果是「只有声音、画面全黑」。
  # 补丁内容见 third_party/video_player_win/windows/video_player_win_plugin.cpp
  video_player_win:
    path: third_party/video_player_win
  audioplayers: ^6.8.1

  # --- 用系统默认播放器打开（兜底） ---
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
