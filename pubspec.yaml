name: viewer
description: "ComfyHub — 为 ComfyUI 设计的一站式 AI 助手"
publish_to: 'none'

version: 0.5.1+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # 中文本地化：文本框的选择菜单（复制 / 全选）、返回按钮 tooltip 等
  # 都走 MaterialLocalizations，不接这一层就会漏出英文的 "Copy / Select all"
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # --- 网络 / 状态 / 本地设置 ---
  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  # shared_preferences_windows 的 pathProvider 字段类型就是它；
  # portable_paths.dart 要 subclass 它把偏好落盘位置搬进项目内（受限会话加固）。
  path_provider_windows: ^2.3.0
  # SharedPreferencesStorePlatform 在这里（shared_preferences 只 export types.dart）。
  shared_preferences_platform_interface: ^2.4.2
  # 直接 import 它拿 SharedPreferencesWindows（换掉 pathProvider 注入缝）。
  shared_preferences_windows: ^2.4.1

  # --- 选择本地文件上传 ---
  file_picker: ^13.3.2
  # 手机端产物缓存目录（`<app-support>/media-cache`）。桌面端只有
  # `path_provider_windows`，跨平台入口要这一个。
  path_provider: ^2.1.5

  # --- 时间格式化 ---
  intl: ^0.20.3

  # --- 媒体播放 ---
  # Windows 视频：media_kit（libmpv + GPU 渲染/硬解），libplacebo 做视频 tone mapping。
  # 本地缓冲开大：4K 高码率文件来回拖动时不至于频繁重新读盘/解码。
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  # 安卓 / iOS 走**官方** video_player（`video_player_win` 只有 Windows 实现，
  # 手机上的表现曾经是"当前平台不支持内嵌播放"）。两份实现由
  # lib/widgets/video_view.dart 的 PlatformVideoView 按平台分派 ——
  # 它们不是二选一：**两个都要留着**。
  video_player: ^2.14.0
  audioplayers: ^6.8.1

  # --- 用系统默认播放器打开（兜底） ---
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  # 训练台内嵌 WebUI（Windows / Android 都要）。**刻意不用 flutter_inappwebview**：
  # 它的 Windows 端（flutter_inappwebview_windows 0.6.0）在**插件注册时**就创建
  # Windows.UI.Composition.Compositor + DispatcherQueue（InAppWebViewManager 构造
  # 函数），进程收尾释放顺序错误 → 关闭窗口必弹 "Unknown Hard Error"
  # （csrss 硬错误，出错模块 dcomp.dll；上游 flutter_inappwebview#2512 关门未修）。
  # webview_all 是 webview_flutter 的跨平台实现：1.4.1 修过同类退出崩溃，Android
  # 端支持 AGP 9 内建 Kotlin —— 换过来去掉了 Android 的 third_party 补丁副本。
  # ⚠ Windows 端的 <experimental/coroutine> 逃生宏**仍然要留**（1.4.12 也没躲开），
  # 见 windows/CMakeLists.txt。**升级前必须跑 Windows 关窗回归**（AGENTS §9.1）；
  # 1.4.12 已在本机跑过：WM_CLOSE 后 System 日志 0 条 Application Popup（ID 26）。
  webview_all: ^1.5.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
